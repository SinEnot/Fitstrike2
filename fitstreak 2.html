function drw(kk,i){const q=S.plans.find(x=>x.id===kk.split('|')[0]);S.pdr=S.pdr||{};if(i==null)i=Math.floor(Math.random()*q.pens.length);S.pdr[kk]=q.pens[i];sv();R()}
const dl=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'});
function pcard(){const o=pens();if(!o.length)return '';const sum={};o.forEach(q=>{if(q.pn){const e=E[q.pn.ex];sum[e.id]=(sum[e.id]||0)+q.pn.amt}});const st=Object.keys(sum).map(k=>sum[k]+' '+U[E[k].u]+' '+E[k].n).join(' + ');
return `<h2>Offene Strafen</h2><div class="res bad"><b>${st||o.length+' Strafe'+(o.length>1?'n':'')+' offen'}</b><span>${st?'noch zu erledigen':'noch nicht ausgelost oder gewählt'}</span></div>`+o.slice(0,8).map(q=>{if(!q.pn)return `<div class="card"><b>Strafe für ${E[q.it.ex].n}, ${dl(q.d)}</b><div class="row" style="margin-top:8px;flex-wrap:wrap">${q.p.pmode==='rand'?`<button class="pri" onclick="drw('${q.kk}')">Auslosen</button>`:q.p.pens.map((x,j)=>`<button onclick="drw('${q.kk}',${j})">${x.amt} ${U[E[x.ex].u]} ${E[x.ex].n}</button>`).join('')}</div></div>`;const e=E[q.pn.ex];return `<div class="card row"><div class="g"><b>${q.pn.amt} ${U[e.u]} ${e.n}</b><div class="mu">für ${E[q.it.ex].n}, ${dl(q.d)}</div></div><button class="pri" onclick="pdone('${q.kk}')">Erledigt</button></div>`}).join('')+(o.length>8?`<p class="mu">und ${o.length-8} weitere</p>`:'')}
function pdone(k){S.pd=S.pd||{};S.pd[k]=1;sv();R()}
function jkSet(on){const p=pl(),k=p.id+'|'+D;S.jk=S.jk||{};if(on){if(S.jmax-jUsed(p,D)<1)return;S.jk[k]=1}else delete S.jk[k];sv();R()}
function startR(){stopT();tmr=setInterval(()=>{G.rest--;const t=$('#rt');if(t)t.textContent=Math.max(G.rest,0);if(G.rest<=0){stopT();G.rest=0;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}beep();vG()}},1000)}
function skipR(){stopT();G.rest=0;vG()}
function saveW(){const v=parseFloat($('#kg').value.replace(',','.'));if(!v)return;S.w=S.w||{};S.w[TD]=v;sv();R()}
function cpy(id){const t=$('#'+id),m=x=>$('#msg').textContent=x;t.select();try{document.execCommand('copy');m('Kopiert.')}catch(e){m('Bitte den Text markieren und selbst kopieren.')}}
function imp(){const m=x=>$('#msg').textContent=x;try{const o=JSON.parse($('#im').value);if(!o.plans||!o.plans.length||!o.log)throw 0;S=o;mig();sv();R();m('Wiederhergestellt.')}catch(e){m('Das hat nicht geklappt. Prüfe, ob der ganze Text eingefügt ist.')}}
let wo=0;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function loadCx(){(S.cx||[]).forEach(c=>{E[c.id]={id:c.id,n:c.n,u:c.u,m:'Eigene Übung',t:'',a:null,b:null,custom:1}})}
function sy(){const q=P();q.pen=q.pens[0]||{ex:'',amt:1};sv()}
function beep(){if(!S.snd)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function say(t){if(!S.say)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(window._tt);window._tt=setTimeout(()=>{e.hidden=true},2600)}
function rec(id){const p=pl(),it=p.items.find(i=>i.id===id);if(!it)return;const cur=amt(p,it,D),prev=Object.keys(S.log).filter(k=>k.startsWith(p.id+'|')&&k.split('|')[1]!==D&&S.log[k][id]===true).map(k=>amt(p,it,k.split('|')[1]));if(prev.length&&cur>Math.max(...prev)){beep();toast('Neuer Bestwert: '+cur+' '+E[it.ex].n)}}
function resc(p){if(D!==TD)return '';const y=add(TD,-1);if(S.dbl&&S.dbl[p.id+'|'+TD])return `<div class="card">Rettungstag: Heute gelten doppelte Mengen. Schaffst du alles, zählt gestern als geschafft.</div><button onclick="rescOff()">Abbrechen</button>`;if(!dly(p)||!req(p,y).length||ok0(p,y)||(S.rs&&S.rs[p.id+'|'+y]))return '';return `<button onclick="rescOn()">Serie retten: heute doppelte Menge</button>`}
function rescOn(){const p=pl();S.rs=S.rs||{};S.dbl=S.dbl||{};S.rs[p.id+'|'+add(TD,-1)]=TD;S.dbl[p.id+'|'+TD]=1;sv();R()}
function rescOff(){const p=pl();if(S.rs)delete S.rs[p.id+'|'+add(TD,-1)];if(S.dbl)delete S.dbl[p.id+'|'+TD];sv();R()}
function wr(p){const w=ws(add(TD,wo*7)),days=[0,1,2,3,4,5,6].map(i=>add(w,i)).filter(d=>d<=TD);let tr=0,okc=0,yes=0,no=0,nb=0;
days.forEach(d=>{if(req(p,d).length){tr++;if(okD(p,d))okc++}const l=L(d,p);act(p,d).forEach(i=>{if(l[i.id]===true)yes++;if(l[i.id]===false)no++})});
p.items.forEach(it=>{const wk=days.filter(d=>L(d,p)[it.id]===true).map(d=>amt(p,it,d));if(!wk.length)return;const bef=Object.keys(S.log).filter(k=>k.startsWith(p.id+'|')&&k.split('|')[1]<w&&S.log[k][it.id]===true).map(k=>amt(p,it,k.split('|')[1]));if(bef.length&&Math.max(...wk)>Math.max(...bef))nb++});
const tot=yes+no,pc=tot?Math.round(yes/tot*100):0,gr=pc>=95?1:pc>=85?2:pc>=70?3:pc>=55?4:pc>=40?5:6;
return `<h2>Wochen-Rückblick</h2><div class="dn"><button onclick="wo--;R()" aria-label="Vorherige Woche">‹</button><b>${wo===0?'Diese Woche':wo===-1?'Letzte Woche':'Vor '+(-wo)+' Wochen'}</b><button ${wo>=0?'disabled':''} onclick="wo++;R()" aria-label="Nächste Woche">›</button></div><div class="card st"><div><b>${okc}/${tr}</b>Tage komplett</div><div><b>${yes}</b>geschafft</div><div><b>${no}</b>nicht geschafft</div><div><b>${tot?gr:'–'}</b>Note</div><div><b>${nb}</b>neue Bestwerte</div></div>`}
function cxForm(){return `<div class="card"><b>Eigene Übung anlegen</b><div class="row" style="margin-top:8px"><input id="cn" placeholder="Name der Übung" style="flex:1"><select id="cu" style="width:auto"><option value="x">Wdh.</option><option value="s">Sek.</option><option value="km">km</option></select></div><button class="pri" style="margin-top:8px" onclick="addCx()">Hinzufügen</button><p class="mu" id="cm"></p></div>`}
function addCx(){const n=$('#cn').value.trim();if(!n){$('#cm').textContent='Bitte einen Namen eingeben.';return}const c={id:'c'+Date.now(),n,u:$('#cu').value};S.cx=S.cx||[];S.cx.push(c);loadCx();sv();R()}
function delCx(id){if(S.plans.some(q=>q.items.some(i=>i.ex===id)||(q.pens||[]).some(x=>x.ex===id))){$('#m').insertAdjacentHTML('afterbegin','');toast('Wird noch in einem Plan benutzt.');return}S.cx=(S.cx||[]).filter(c=>c.id!==id);delete E[id];sv();R()}
function gstat(g){const p=S.plans.find(x=>x.id===g.plan),it=p&&p.items.find(i=>i.id===g.item);if(!it)return null;let rem=0;for(let d=add(TD,1);d<=g.date&&rem<900;d=add(d,1))if(isI(it,d))rem+=(it.mode==='week'?(it.wk||3)/7:1);rem=Math.round(rem);const a0=amt(p,it,TD),pr=it.mul>1?Math.round(a0*Math.pow(it.mul,rem)):a0+(it.inc||0)*rem;return {it,rem,a0,pr,need:rem>0?(g.target-a0)/rem:0}}
function addG(){const p=pl(),t=+$('#gt').value,d=$('#gd').value;if(!t||!d||d<=TD||!p.items.length){toast('Bitte Ziel und ein Datum in der Zukunft angeben.');return}S.goals=S.goals||[];S.goals.push({id:'g'+Date.now(),plan:p.id,item:$('#gi').value,target:t,date:d});sv();R()}
function delG(id){S.goals=S.goals.filter(g=>g.id!==id);sv();R()}
function duel(){const p=pl(),b={};p.items.forEach(it=>{const a=Object.keys(S.log).filter(k=>k.startsWith(p.id+'|')&&S.log[k][it.id]===true).map(k=>amt(p,it,k.split('|')[1]));b[E[it.ex].n]=a.length?Math.max(...a):0});const w=[0,1,2,3,4,5,6].map(i=>add(TD,-i)).filter(d=>okD(p,d)).length;return 'FS1:'+JSON.stringify({n:S.name||'Ich',s:strk(p),w,b})}
function cmp(){const out=$('#cmr');try{const t=$('#fd').value.trim().replace(/^FS1:/,''),f=JSON.parse(t),me=JSON.parse(duel().slice(4)),n=x=>Number(x)||0;let h=`<div class="card st"><div><b>${n(me.s)} : ${n(f.s)}</b>Serie (${esc(me.n)} : ${esc(f.n)})</div><div><b>${n(me.w)} : ${n(f.w)}</b>Tage in 7 Tagen</div></div>`;Object.keys(me.b).forEach(k=>{if(f.b&&k in f.b)h+=`<div class="card row"><div class="g"><b>${esc(k)}</b></div><b>${n(me.b[k])} : ${n(f.b[k])}</b></div>`});out.innerHTML=h}catch(e){out.textContent='Der Text konnte nicht gelesen werden.'}}
function vM(){const wk=Object.keys(S.w||{}).sort(),pts=wk.slice(-30).map(d=>({y:S.w[d]})),p=pl(),gs=(S.goals||[]).filter(g=>g.plan===p.id);
return `<h1>Mehr</h1><h2>Training</h2><div class="row"><input type="number" min="0" max="600" value="${S.rest}" onchange="S.rest=Math.max(0,+this.value||0);sv()"><span>Sekunden Pause zwischen den Übungen (0 = aus)</span></div>
<p><label><input type="checkbox" ${S.snd?'checked':''} onchange="S.snd=this.checked?1:0;sv()"> Töne und Vibration</label><br><label><input type="checkbox" ${S.say?'checked':''} onchange="S.say=this.checked?1:0;sv()"> Sprachansage im Training</label></p>
<h2>Joker</h2><div class="row"><input type="number" min="0" max="7" value="${S.jmax}" onchange="S.jmax=Math.max(0,Math.min(7,+this.value||0));sv()"><span>Joker pro Woche und Plan</span></div><p class="mu">Ein Joker macht einen Tag frei: keine Strafe, die Serie bleibt erhalten.</p>
<h2>Erinnerung</h2><div class="row"><input type="time" value="${S.rem||''}" onchange="S.rem=this.value;sv()"><span>Hinweis in der App ab dieser Uhrzeit</span></div><p class="mu">Echte Benachrichtigungen kann eine Web-App auf dem iPhone nicht zuverlässig senden. Dafür eignet sich die Erinnerungen-App.</p>
<h2>Ziele · ${esc(p.n)}</h2>${gs.map(g=>{const t=gstat(g);if(!t)return '';const ok=t.pr>=g.target;return `<div class="card"><b>${E[t.it.ex].n}: ${g.target} bis ${g.date.split('-').reverse().join('.')}</b><div class="mu">Heute ${t.a0}, noch ${t.rem} Tage. Mit deiner Steigerung erreichst du etwa ${t.pr}.</div><div class="res ${ok?'good':'bad'}" style="padding:8px 12px;margin:8px 0"><b style="font-size:22px">${ok?'Auf Kurs':'Zu langsam: etwa +'+Math.ceil(Math.max(0,t.need)*10)/10+' pro Tag nötig'}</b></div><button onclick="delG('${g.id}')">Löschen</button></div>`}).join('')}
${p.items.length?`<div class="card"><div class="row"><select id="gi">${p.items.map(i=>`<option value="${i.id}">${E[i.ex].n}</option>`).join('')}</select></div><div class="row" style="margin-top:8px"><input type="number" id="gt" min="1" placeholder="Ziel" style="width:80px"><input type="date" id="gd"></div><button class="pri" style="margin-top:8px" onclick="addG()">Ziel hinzufügen</button></div>`:'<p class="mu">Dieser Plan hat keine Übungen.</p>'}
<h2>Körpergewicht</h2><div class="row"><input type="text" inputmode="decimal" id="kg" placeholder="kg" style="width:90px"><button onclick="saveW()">Für heute speichern</button></div><div style="margin-top:10px">${chart(pts)}</div>${wk.length?`<p class="mu">Zuletzt: ${S.w[wk[wk.length-1]]} kg am ${wk[wk.length-1].split('-').reverse().join('.')}</p>`:''}
<h2>Duell mit Freunden</h2><div class="row"><input type="text" placeholder="Dein Name" value="${esc(S.name||'')}" onchange="S.name=this.value;sv();R()" style="flex:1"></div><p class="mu">Schick deinen Text einem Freund und füge seinen unten ein.</p><textarea id="du" readonly rows="2" style="width:100%;box-sizing:border-box">${esc(duel())}</textarea><button onclick="cpy('du')">Kopieren</button>
<textarea id="fd" rows="2" placeholder="Text deines Freundes einfügen" style="width:100%;box-sizing:border-box;margin-top:10px"></textarea><button class="pri" onclick="cmp()">Vergleichen</button><div id="cmr" style="margin-top:10px"></div>
<h2>Datensicherung</h2><p class="mu">Kopiere den Text und speichere ihn zum Beispiel in Notizen. Zum Wiederherstellen fügst du ihn unten ein.</p><textarea id="ex" readonly rows="3" style="width:100%;box-sizing:border-box">${esc(JSON.stringify(S))}</textarea><button onclick="cpy('ex')">Kopieren</button>
<textarea id="im" rows="3" placeholder="Gesicherten Text hier einfügen" style="width:100%;box-sizing:border-box;margin-top:10px"></textarea><button class="pri" onclick="imp()">Wiederherstellen</button><p class="mu" id="msg"></p>`}
R();requestAnimationFrame(loop);
</script></body></html>
